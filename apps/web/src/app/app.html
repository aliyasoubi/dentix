<app-ds-app-shell [brandTitle]="'app.title' | translate">
  <!-- One projectable root node per @if, deliberately. Angular only honours
       a slot selector when the surrounding control-flow block has a single
       root node; with several, the content silently falls through to the
       default slot instead — which here would drop the session controls into
       the page body rather than the toolbar (NG8011). -->
  @if (auth.isAuthenticated() && auth.session()?.isOfficeAdmin) {
  <app-ds-button dsAppShellNav tier="tertiary" routerLink="/office-users">
    {{ "common.nav.addUser" | translate }}
  </app-ds-button>
  } @if (auth.isAuthenticated()) {
  <ng-container dsAppShellActions>
    <span class="app__user">{{ auth.session()?.displayName }}</span>
    <app-ds-button tier="secondary" (pressed)="logout()">
      {{ "common.actions.logout" | translate }}
    </app-ds-button>
  </ng-container>
  }

  <router-outlet />
</app-ds-app-shell>
