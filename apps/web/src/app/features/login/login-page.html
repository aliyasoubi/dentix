<section class="login-page">
  <h1 class="login-page__title ds-text-page-title">{{ "login.title" | translate }}</h1>

  @if (errorMessageKey(); as key) {
  <app-ds-alert variant="danger">{{ key | translate }}</app-ds-alert>
  }

  <button mat-flat-button color="primary" type="button" (click)="signIn()">
    {{ "login.action.signIn" | translate }}
  </button>
</section>
