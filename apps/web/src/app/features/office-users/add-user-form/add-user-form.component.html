<form [formGroup]="form" (ngSubmit)="submit()" class="add-user-form">
  <app-ds-text-field
    [label]="'officeUsers.form.email.label' | translate"
    [control]="form.controls.email"
    [errors]="EMAIL_ERRORS"
    [required]="true"
    [latin]="true"
    type="email"
  />

  <!-- Required, not optional: the backend rejects a request without one,
       because a membership with no role can do nothing at all. -->
  <app-ds-select-field
    [label]="'officeUsers.form.roleCode.label' | translate"
    [control]="form.controls.roleCode"
    [options]="ROLE_OPTIONS"
    [required]="true"
  />

  @if (errorMessage(); as message) {
    <app-ds-alert variant="danger">{{ message }}</app-ds-alert>
  }

  @if (successMessage(); as message) {
    <app-ds-alert variant="success">{{ message }}</app-ds-alert>
  }

  <div class="add-user-form__actions">
    <app-ds-submit-button
      [label]="'officeUsers.form.submit' | translate"
      [submitting]="submitting()"
      [disabled]="form.invalid"
    />
  </div>
</form>
