<app-ds-page-header
  [title]="'officeUsers.page.title' | translate"
  [description]="'officeUsers.page.description' | translate"
/>

<app-ds-section [heading]="'officeUsers.form.title' | translate">
  <app-add-user-form
    [submitting]="submitting()"
    [errorMessage]="submitError()"
    [successMessage]="successMessage()"
    (submitted)="add($event)"
  />

  @if (needsReauthentication()) {
  <app-ds-button tier="secondary" class="office-users-page__reauth" (pressed)="reauthenticate()">
    {{ "officeUsers.form.reauthenticate" | translate }}
  </app-ds-button>
  }
</app-ds-section>
