<app-ds-page-header
  [title]="'patients.page.title' | translate"
  [description]="'patients.page.description' | translate"
/>

<section class="patients-page__section">
  <h2 class="patients-page__section-title ds-text-section-title">{{ "patients.form.title" | translate }}</h2>

  <app-patient-registration-form
    [submitting]="submitting()"
    [errorMessage]="submitError()"
    [successMessage]="successMessage()"
    (submitted)="create($event)"
  />
</section>

<section class="patients-page__section">
  <app-patient-search
    [query]="searchQuery()"
    [results]="results()"
    [searching]="searching()"
    [hasSearched]="hasSearched()"
    [errorMessage]="searchError()"
    (queryChange)="onQueryChange($event)"
  />
</section>
