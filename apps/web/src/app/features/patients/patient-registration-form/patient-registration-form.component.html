<form [formGroup]="form" (ngSubmit)="submit()" class="patients-form">
  <!-- Only what a front-desk registration genuinely needs to start a chart:
       the name, and one way to reach the patient. Everything else is real
       but optional data, tucked behind the panel below rather than shown
       up front on every single registration. -->
  <div class="patients-form__row">
    <app-ds-text-field
      [label]="'patients.form.nativeName.label' | translate"
      [control]="form.controls.nativeName"
      [errors]="NATIVE_NAME_ERRORS"
      [required]="true"
    />

    <app-ds-text-field
      [label]="'patients.form.phone.label' | translate"
      [control]="form.controls.phone"
      [errors]="PHONE_ERRORS"
      [latin]="true"
      inputMode="tel"
      placeholder="09xxxxxxxxx"
    />
  </div>

  <app-ds-checkbox-field
    [label]="'patients.form.contactUnavailable.label' | translate"
    [control]="form.controls.contactUnavailable"
  />

  <!-- Group-level rule, so it has no single field to attach to. Shown only
       after the user has engaged with the form, per §15 ("Validation
       appears after blur or submit"). -->
  @if (form.hasError("contactRequired") && form.touched) {
    <app-ds-alert variant="danger">
      {{ "patients.form.error.CONTACT_REQUIRED" | translate }}
    </app-ds-alert>
  }

  <!-- No [expanded] binding: it defaults to closed, and none of the fields
       inside can carry a validation error while collapsed (latinName and
       dateOfBirth have no validators; sex always has a default) — so there
       is nothing here that would need to force itself open. -->
  <mat-expansion-panel class="patients-form__more">
    <mat-expansion-panel-header>
      <mat-panel-title>{{ "patients.form.moreDetails" | translate }}</mat-panel-title>
    </mat-expansion-panel-header>

    <div class="patients-form__row">
      <app-ds-text-field
        [label]="'patients.form.latinName.label' | translate"
        [control]="form.controls.latinName"
        [latin]="true"
      />

      <app-ds-select-field
        [label]="'patients.form.sex.label' | translate"
        [control]="form.controls.sex"
        [options]="SEX_OPTIONS"
      />
    </div>

    <div class="patients-form__row">
      <app-ds-date-field
        [label]="'patients.form.dateOfBirth.label' | translate"
        [control]="form.controls.dateOfBirth"
      />
    </div>
  </mat-expansion-panel>

  @if (errorMessage(); as message) {
    <app-ds-alert variant="danger">{{ message }}</app-ds-alert>
  }

  @if (successMessage(); as message) {
    <app-ds-alert variant="success">{{ message }}</app-ds-alert>
  }

  <div class="patients-form__actions">
    <app-ds-submit-button
      [label]="'patients.form.submit' | translate"
      [submitting]="submitting()"
      [disabled]="form.invalid"
    />
  </div>
</form>
