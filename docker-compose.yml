# Dev-only stack for Release 0.5. Deliberately does not include Redis or
# BullMQ — see docs/07-plans/00-build-sequencing.md: messaging
# infrastructure is added when the first real async workflow needs it
# (~R2), not before. MinIO joined in S7, the slice where document storage
# (the PDF receipt pipeline, ADR-009) actually starts — per the same doc,
# "add MinIO only when document storage starts." This is the dev-only
# container; "MinIO/S3 production setup" itself remains an R6 concern.
#
# Keycloak runs its own embedded dev store (`start-dev`); it does not share
# the `dentix` Postgres database. The `dentix` realm (ADR-007) is imported
# from keycloak/dentix-realm.json on every startup — the file is the
# reviewable, restorable source of truth; the container is disposable.
# The dentix-bff client's secret is deliberately not in that file (never
# commit a secret); Keycloak generates a fresh one on each import. After
# first startup, fetch it once (see keycloak/README.md) and put it in
# .env as OIDC_CLIENT_SECRET.

services:
  postgres:
    image: postgres:18.0
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dentix}
      POSTGRES_USER: ${POSTGRES_USER:-dentix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dentix_dev_only}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      # Postgres 18's image changed convention: mount the parent dir, not
      # .../data — it manages a major-version-specific subdirectory itself.
      - dentix_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dentix} -d ${POSTGRES_DB:-dentix}"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.7
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_dev_only}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 5s
      timeout: 5s
      retries: 20

  # S3-compatible dev object storage (ADR-009). The worker ensures its
  # bucket exists on startup (idempotent CreateBucket) rather than this
  # compose file provisioning one — the same thing a real S3 account setup
  # would do, and one less moving part here.
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-dentix}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-dentix_dev_only}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - dentix_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dentix_postgres_data:
  dentix_minio_data:
