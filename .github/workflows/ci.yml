name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    # Matches docker-compose.yml's own defaults (no .env file in CI) so
    # there's exactly one place that defines what "the dev/CI Postgres"
    # looks like, instead of a second copy here that can silently drift.
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5433
      POSTGRES_DB: dentix
      POSTGRES_USER: dentix
      POSTGRES_PASSWORD: dentix_dev_only
      # CI-only throwaway key — protects nothing but ephemeral test data in
      # this run. Real environments generate their own (see .env.example).
      SESSION_ENCRYPTION_KEY: "-rh27R89xGUe8BzZy9sqm7waoMFsdVQYfycL_Zw7oZY"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Start Postgres (docker-compose.yml, postgres service only)
        run: |
          docker compose up -d postgres
          until docker compose ps postgres --format json | grep -q healthy; do
            echo "waiting for postgres..."
            sleep 2
          done

      # Canonical always-on gate (docs/08-implementation/01-workflow.md).
      # openapi:check joins this list starting with S8.
      - name: Lint
        run: npm run lint

      - name: Architecture lint (proves ADR-006)
        run: npm run lint:arch

      - name: Unit tests
        run: npm run test

      - name: Migration up / down / up (S2 Verify line)
        run: |
          npm run db:migrate
          npm run db:migrate:down
          npm run db:migrate

      - name: Integration tests
        run: npm run test:int

      - name: API contract tests
        run: npm run test:api

      - name: Build
        run: npm run build
