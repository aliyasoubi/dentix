name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  verify:
    runs-on: ubuntu-latest

    # Matches docker-compose.yml's own defaults (no .env file in CI) so
    # there's exactly one place that defines what "the dev/CI Postgres"
    # looks like, instead of a second copy here that can silently drift.
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5433
      POSTGRES_DB: dentix
      POSTGRES_USER: dentix
      POSTGRES_PASSWORD: dentix_dev_only
      # CI-only throwaway key — protects nothing but ephemeral test data in
      # this run. Real environments generate their own (see .env.example).
      SESSION_ENCRYPTION_KEY: "-rh27R89xGUe8BzZy9sqm7waoMFsdVQYfycL_Zw7oZY"
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin_ci_only
      OIDC_ISSUER_URL: http://localhost:8080/realms/dentix
      OIDC_CLIENT_ID: dentix-bff
      OIDC_REDIRECT_URI: http://localhost:3000/api/v1/auth/callback
      APP_BASE_URL: http://localhost:3000
      MINIO_ROOT_USER: dentix
      MINIO_ROOT_PASSWORD: dentix_ci_only
      MINIO_ENDPOINT: http://localhost:9000
      MINIO_BUCKET: dentix-documents-ci

    steps:
      - uses: actions/checkout@v4

      # .nvmrc pins Node exactly (22.23.2). Node 24 aborts apps/web's Vitest
      # run with SIGABRT — see the warning in README.md's "Getting started"
      # before changing this.
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Start Postgres, Keycloak, and MinIO (docker-compose.yml)
        run: |
          docker compose up -d postgres keycloak minio
          until docker compose ps postgres --format json | grep -q healthy; do
            echo "waiting for postgres..."
            sleep 2
          done
          until docker compose ps keycloak --format json | grep -q healthy; do
            echo "waiting for keycloak..."
            sleep 3
          done
          until docker compose ps minio --format json | grep -q healthy; do
            echo "waiting for minio..."
            sleep 2
          done

      - name: Fetch the dentix-bff client secret (realm imported fresh each start)
        run: |
          TOKEN=$(curl -s -X POST http://localhost:8080/realms/master/protocol/openid-connect/token \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "username=$KEYCLOAK_ADMIN&password=$KEYCLOAK_ADMIN_PASSWORD&grant_type=password&client_id=admin-cli" \
            | node -e "process.stdin.on('data', d => process.stdout.write(JSON.parse(d).access_token))")
          UUID=$(curl -s "http://localhost:8080/admin/realms/dentix/clients?clientId=$OIDC_CLIENT_ID" \
            -H "Authorization: Bearer $TOKEN" \
            | node -e "process.stdin.on('data', d => process.stdout.write(JSON.parse(d)[0].id))")
          SECRET=$(curl -s "http://localhost:8080/admin/realms/dentix/clients/$UUID/client-secret" \
            -H "Authorization: Bearer $TOKEN" \
            | node -e "process.stdin.on('data', d => process.stdout.write(JSON.parse(d).value))")
          echo "OIDC_CLIENT_SECRET=$SECRET" >> "$GITHUB_ENV"

      # Canonical always-on gate (docs/08-implementation/01-workflow.md).
      - name: Format check
        run: npm run format

      - name: Lint
        run: npm run lint

      - name: Architecture lint (proves ADR-006)
        run: npm run lint:arch

      - name: Unit tests
        run: npm run test

      # S8: regenerates apps/api/openapi.json from the live NestJS app and
      # apps/web's api-types.gen.ts from that contract, then fails on any
      # uncommitted drift in either — needs Postgres (already up above) for
      # NestFactory.create(AppModule) to bootstrap, same as test:int/test:api.
      - name: OpenAPI contract check
        run: npm run openapi:check

      - name: Migration up / down / up (S2 Verify line)
        run: |
          npm run db:migrate
          npm run db:migrate:down
          npm run db:migrate

      # apps/worker renders receipts via headless Chromium (ADR-009); the
      # binary isn't in the npm cache, only this explicit install step.
      - name: Install Playwright Chromium (worker PDF rendering)
        run: npx playwright install --with-deps chromium
        working-directory: apps/worker

      - name: Integration tests
        run: npm run test:int

      - name: API contract tests (bootstraps against the live Keycloak service above)
        run: npm run test:api

      - name: Build
        run: npm run build
